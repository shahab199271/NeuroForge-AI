[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroforge-ai"
version = "0.1.0"
maintainers = [{name = "Shahab Baloochi"}]
description = "Reproducible LLM fine-tuning, evaluation, benchmarking and serving"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "transformers>=4.46,<5",
  "peft>=0.13",
  "datasets>=3.0",
  "accelerate>=1.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.0",
  "scikit-learn>=1.4",
  "numpy>=1.24",
]

[project.optional-dependencies]
qlora = ["bitsandbytes>=0.44"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
